name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.8.9"

jobs:
  build:
    name: Build (Python ${{ env.PYTHON_VERSION }})
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Create virtual environment
        run: uv venv .venv --python ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install --python .venv\Scripts\python.exe openpyxl
          uv pip install --python .venv\Scripts\python.exe "pyinstaller>=6.0"

      - name: Show environment
        run: |
          .venv\Scripts\python.exe --version
          .venv\Scripts\python.exe -c "import openpyxl, PyInstaller; print('openpyxl', openpyxl.__version__); print('pyinstaller', PyInstaller.__version__)"

      - name: Self-check imports
        run: .venv\Scripts\python.exe -c "import fee_core, fee_app; print('modules OK')"

      - name: Build executable (PyInstaller)
        run: .venv\Scripts\python.exe -m PyInstaller fee_app.spec --noconfirm --clean --distpath dist --workpath build

      - name: Verify executable runs
        run: |
          $p = Start-Process -FilePath "dist\FeeMan\FeeMan.exe" -ArgumentList "--help" -PassThru -Wait -NoNewWindow
          Write-Host "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "FeeMan.exe --help failed" }

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }

      - name: Build installer (Inno Setup)
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if errorlevel 1 exit /b 1

      - name: Collect artifacts
        id: collect
        shell: pwsh
        run: |
          $version = "1.0.0"
          $setup = Get-ChildItem "dist\FeeMan-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "installer not produced" }
          Write-Host ("installer: {0} ({1:N1} MB)" -f $setup.Name, ($setup.Length / 1MB))

          # 免安装版打成 zip
          $zip = "dist\FeeMan-portable-$version.zip"
          Compress-Archive -Path "dist\FeeMan\*" -DestinationPath $zip -Force
          Write-Host ("portable: {0} ({1:N1} MB)" -f (Split-Path $zip -Leaf), ((Get-Item $zip).Length / 1MB))

          "setup=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          "zip=$((Get-Item $zip).FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FeeMan-python${{ env.PYTHON_VERSION }}-windows-x64
          path: |
            ${{ steps.collect.outputs.setup }}
            ${{ steps.collect.outputs.zip }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.collect.outputs.setup }}
            ${{ steps.collect.outputs.zip }}
          generate_release_notes: true
